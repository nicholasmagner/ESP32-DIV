name: Startup asset checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/startup-requirements.txt
      - run: python tools/generate_startup_assets.py
      - run: git diff --exit-code -- ESP32-DIV/StartupAssets.cpp ESP32-DIV/StartupAssets.h
      - run: python tools/check_startup_assets.py
